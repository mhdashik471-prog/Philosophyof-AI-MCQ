<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Philosophy of AI - Online Examination</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --primary-dark: #1e293b;
      --secondary: #0f766e;
      --success: #15803d;
      --success-bg: #dcfce7;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --warning: #b45309;
      --warning-bg: #fef3c7;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'Noto Sans Malayalam', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding: 24px 16px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    .exam-header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 24px;
      border-radius: var(--radius);
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .exam-header h1 {
      font-size: 26px;
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .exam-header p {
      font-size: 15px;
      opacity: 0.9;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }

    #login-screen .card {
      max-width: 500px;
      margin: 40px auto;
      text-align: center;
    }
    .form-group {
      margin: 20px 0;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: var(--primary-light);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      margin: 20px 0;
    }
    .btn-tool {
      background: #f1f5f9;
      color: #334155;
      padding: 6px 14px;
      font-size: 13px;
      margin-right: 8px;
      border: 1px solid #cbd5e1;
    }
    .btn-tool:hover {
      background: #e2e8f0;
      color: #0f172a;
    }
    .btn-tool.active {
      background: #e0e7ff;
      border-color: #818cf8;
      color: #3730a3;
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .q-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 16px;
    }
    .mal-text {
      display: none;
      color: #0369a1;
      font-weight: 500;
      margin-left: 6px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14.5px;
      transition: all 0.2s ease;
      background: #ffffff;
      user-select: none;
    }
    .option-item:hover:not(.locked) {
      border-color: var(--primary-light);
      background: #f8fafc;
    }
    .option-item input[type="radio"] {
      margin-top: 3px;
      margin-right: 12px;
      accent-color: var(--primary);
    }
    .option-item.locked {
      cursor: default;
    }
    .option-item.correct {
      background-color: var(--success-bg) !important;
      border-color: var(--success) !important;
      color: #14532d !important;
      font-weight: 600;
    }
    .option-item.incorrect {
      background-color: var(--danger-bg) !important;
      border-color: var(--danger) !important;
      color: #7f1d1d !important;
    }

    .status-badge {
      display: none;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 12px;
      width: fit-content;
    }
    .status-badge.correct {
      display: inline-block;
      background: var(--success-bg);
      color: var(--success);
    }
    .status-badge.incorrect {
      display: inline-block;
      background: var(--danger-bg);
      color: var(--danger);
    }

    .hint-container {
      display: none;
      background: var(--warning-bg);
      border-left: 4px solid var(--warning);
      padding: 10px 14px;
      font-size: 13.5px;
      border-radius: 0 6px 6px 0;
      color: #78350f;
      margin-top: 10px;
    }

    .scorecard {
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .scorecard h2 {
      font-size: 22px;
      color: var(--primary);
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      text-align: center;
    }
    .scorecard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .scorecard-metric {
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .metric-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }
    .metric-val {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 4px;
    }
    .metric-val.high { color: var(--success); }
    .metric-val.low { color: var(--danger); }
    .scorecard-note {
      background: #eff6ff;
      border-left: 4px solid var(--primary-light);
      padding: 14px;
      border-radius: 0 8px 8px 0;
      font-size: 14.5px;
      color: #1e3a8a;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: white;
      max-width: 440px;
      width: 100%;
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .modal-card h3 {
      font-size: 19px;
      margin-bottom: 12px;
      color: var(--text-main);
    }
    .modal-card p {
      font-size: 14.5px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
    }
    .modal-actions .btn {
      flex: 1;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }

    @media (max-width: 640px) {
      .exam-header h1 { font-size: 20px; }
      .scorecard-grid { grid-template-columns: 1fr 1fr; }
      .modal-actions { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="container">

  <header class="exam-header">
    <h1>Philosophy of AI</h1>
    <p>Comprehensive Multiple Choice Assessment</p>
  </header>

  <section id="login-screen">
    <div class="card">
      <h2 style="font-size: 20px; margin-bottom: 12px;">MCQ Examination</h2>
      
      <div class="form-group">
        <label for="student-name">Student Full Name</label>
        <input type="text" id="student-name" class="form-control" placeholder="Enter your full name..." autocomplete="off">
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="startExam()">Start Examination</button>
    </div>
  </section>

  <main id="exam-workspace" style="display: none;">
    <div id="top-scorecard-container"></div>
    <div id="questions-list"></div>
    <div id="submit-section">
      <button class="btn btn-primary btn-submit" onclick="handlePreSubmit()">Submit Examination</button>
    </div>
    <div id="bottom-scorecard-container"></div>
  </main>

</div>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal-card">
    <h3>Unanswered Questions</h3>
    <p id="modal-warning-text"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeConfirmModal()">Review Questions</button>
      <button class="btn btn-primary" onclick="executeFinalSubmit()">Proceed & Submit</button>
    </div>
  </div>
</div>

  let userAnswers = new Array(questionBank.length).fill(null);

  function startExam() {
    const nameInput = document.getElementById("student-name");
    const val = nameInput.value.trim();
    if (!val) {
      alert("Please enter your full name to start the examination.");
      nameInput.focus();
      return;
    }
    studentName = val;
    examStartTime = new Date();

    document.getElementById("login-screen").style.display = "none";
    document.getElementById("exam-workspace").style.display = "block";

    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderQuestions() {
    const list = document.getElementById("questions-list");
    list.innerHTML = "";

    questionBank.forEach((qData, qIdx) => {
      const qCard = document.createElement("div");
      qCard.className = "card";
      qCard.id = `q-card-${qIdx}`;

      let optionsHtml = "";
      qData.opts.forEach((opt, optIdx) => {
        optionsHtml += `
          <label class="option-item" id="opt-label-${qIdx}-${optIdx}" onclick="selectAnswer(${qIdx}, ${optIdx})">
            <input type="radio" name="question_${qIdx}" value="${optIdx}">
            <span class="opt-content">
              <strong>${String.fromCharCode(65 + optIdx)})</strong> 
              <span class="opt-en">${escapeHtml(opt)}</span>
              <span class="mal-text opt-mal" id="opt-mal-${qIdx}-${optIdx}">[${escapeHtml(qData.mOpts[optIdx])}]</span>
            </span>
          </label>
        `;
      });

      qCard.innerHTML = `
        <div class="q-meta">
          <span>Question ${qIdx + 1} of ${questionBank.length}</span>
          <span class="status-badge" id="badge-${qIdx}"></span>
        </div>
        <div class="q-text">
          <span class="q-en">${escapeHtml(qData.q)}</span>
          <span class="mal-text q-mal" id="q-mal-${qIdx}">[${escapeHtml(qData.mQ)}]</span>
        </div>
        <div class="options-grid">
          ${optionsHtml}
        </div>
        <div class="card-tools">
          <button type="button" class="btn btn-tool" id="btn-hint-${qIdx}" onclick="toggleHint(${qIdx})">Hint</button>
          <button type="button" class="btn btn-tool" id="btn-mal-${qIdx}" onclick="toggleMalayalam(${qIdx})">Malayalam</button>
        </div>
        <div class="hint-container" id="hint-box-${qIdx}">
          <strong>Clue:</strong> <span class="hint-en">${escapeHtml(qData.hint)}</span>
          <span class="mal-text hint-mal" id="hint-mal-${qIdx}">[${escapeHtml(qData.mHint)}]</span>
        </div>
      `;

      list.appendChild(qCard);
    });
  }

  function selectAnswer(qIdx, optIdx) {
    if (userAnswers[qIdx] !== null || isSubmitted) return;

    userAnswers[qIdx] = optIdx;
    const qData = questionBank[qIdx];
    const isCorrect = (optIdx === qData.ans);

    const qCard = document.getElementById(`q-card-${qIdx}`);
    const labels = qCard.querySelectorAll(".option-item");
    const radios = qCard.querySelectorAll("input[type='radio']");
    
    radios.forEach(r => r.disabled = true);
    labels.forEach(l => l.classList.add("locked"));

    const selectedRadio = labels[optIdx].querySelector("input[type='radio']");
    if (selectedRadio) selectedRadio.checked = true;

    const badge = document.getElementById(`badge-${qIdx}`);
    if (isCorrect) {
      labels[optIdx].classList.add("correct");
      badge.textContent = "✓ Correct Answer";
      badge.className = "status-badge correct";
    } else {
      labels[optIdx].classList.add("incorrect");
      labels[qData.ans].classList.add("correct");
      badge.textContent = "✕ Incorrect Answer";
      badge.className = "status-badge incorrect";
    }
  }

  function toggleHint(qIdx) {
    const hintBox = document.getElementById(`hint-box-${qIdx}`);
    const btn = document.getElementById(`btn-hint-${qIdx}`);
    const isVisible = hintBox.style.display === "block";
    hintBox.style.display = isVisible ? "none" : "block";
    btn.classList.toggle("active", !isVisible);
  }

  function toggleMalayalam(qIdx) {
    const btn = document.getElementById(`btn-mal-${qIdx}`);
    const qCard = document.getElementById(`q-card-${qIdx}`);
    const malElements = qCard.querySelectorAll(".mal-text");

    const willShow = !btn.classList.contains("active");
    btn.classList.toggle("active", willShow);

    malElements.forEach(el => {
      el.style.display = willShow ? "inline" : "none";
    });
  }

  function handlePreSubmit() {
    if (isSubmitted) return;

    const unansweredCount = userAnswers.filter(a => a === null).length;
    if (unansweredCount > 0) {
      document.getElementById("modal-warning-text").textContent = 
        `You have ${unansweredCount} unanswered question${unansweredCount > 1 ? 's' : ''}. Do you want to review them or submit now?`;
      document.getElementById("confirm-modal").classList.add("active");
    } else {
      executeFinalSubmit();
    }
  }

  function closeConfirmModal() {
    document.getElementById("confirm-modal").classList.remove("active");
  }

  function executeFinalSubmit() {
    closeConfirmModal();
    if (isSubmitted) return;
    isSubmitted = true;

    const submitEndTime = new Date();
    const durationSeconds = Math.max(1, Math.round((submitEndTime - examStartTime) / 1000));
    const minutes = Math.floor(durationSeconds / 60);
    const seconds = durationSeconds % 60;
    const timeTakenStr = `${minutes}m ${seconds}s`;

    let score = 0;
    let attended = 0;
    let unattended = 0;

    userAnswers.forEach((ans, idx) => {
      const qData = questionBank[idx];
      const qCard = document.getElementById(`q-card-${idx}`);
      const labels = qCard.querySelectorAll(".option-item");
      const radios = qCard.querySelectorAll("input[type='radio']");

      radios.forEach(r => r.disabled = true);
      labels.forEach(l => l.classList.add("locked"));

      if (ans === null) {
        unattended++;
        labels[qData.ans].classList.add("correct");
        const badge = document.getElementById(`badge-${idx}`);
        badge.textContent = "○ Unattended";
        badge.className = "status-badge incorrect";
      } else {
        attended++;
        if (ans === qData.ans) {
          score++;
        }
      }
    });

    const total = questionBank.length;
    const percentage = Number(((score / total) * 100).toFixed(2));
    let grade = "F";
    if (percentage >= 90) grade = "A+";
    else if (percentage >= 80) grade = "A";
    else if (percentage >= 70) grade = "B";
    else if (percentage >= 60) grade = "C";
    else if (percentage >= 50) grade = "D";

    let motivationalNote = "";
    if (percentage >= 85) {
      motivationalNote = "Outstanding achievement! You possess a profound understanding of Epistemology, Philosophy of Mind, and AI Ethics.";
    } else if (percentage >= 70) {
      motivationalNote = "Well done! You have demonstrated a strong conceptual grasp of foundational AI philosophy and ethics.";
    } else if (percentage >= 50) {
      motivationalNote = "Good effort. Reviewing key concepts in Functionalism, Dualism, and Pramana theory will help strengthen your knowledge.";
    } else {
      motivationalNote = "Keep learning. A structured review of foundational concepts and consistent revision will help improve your understanding.";
    }

    const payload = {
      timestamp: submitEndTime.toISOString(),
      name: studentName,
      subject: SUBJECT_NAME,
      date: submitEndTime.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }),
      timeTaken: timeTakenStr,
      total: total,
      attended: attended,
      unattended: unattended,
      score: score,
      percentage: percentage,
      grade: grade
    };

    const scorecardHtml = createScorecardHTML(payload, motivationalNote);
    document.getElementById("top-scorecard-container").innerHTML = scorecardHtml;
    document.getElementById("bottom-scorecard-container").innerHTML = scorecardHtml;

    document.getElementById("submit-section").style.display = "none";
    window.scrollTo({ top: 0, behavior: 'smooth' });

    sendPayloadSilently(payload);
  }

  function createScorecardHTML(data, note) {
    const isPassing = data.percentage >= 50;
    return `
      <div class="scorecard">
        <h2>Examination Result & Performance Scorecard</h2>
        <div class="scorecard-grid">
          <div class="scorecard-metric">
            <div class="metric-label">Student Name</div>
            <div class="metric-val">${escapeHtml(data.name)}</div>
          </div>
          <div class="scorecard-metric">
            <div class="metric-label">Subject</div>
            <div class="metric-val" style="font-size: 16px;">${escapeHtml(data.subject)}</div>
          </div>
          <div class="scorecard-metric">
            <div class="metric-label">Score / Total</div>
            <div class="metric-val ${isPassing ? 'high' : 'low'}">${data.score} / ${data.total}</div>
          </div>
          <div class="scorecard-metric">
            <div class="metric-label">Percentage</div>
            <div class="metric-val ${isPassing ? 'high' : 'low'}">${data.percentage}%</div>
          </div>
          <div class="scorecard-metric">
            <div class="metric-label">Grade</div>
            <div class="metric-val ${isPassing ? 'high' : 'low'}">${data.grade}</div>
          </div>
          <div class="scorecard-metric">
            <div class="metric-label">Attended / Skipped</div>
            <div class="metric-val" style="font-size: 16px;">${data.attended} / ${data.unattended}</div>
          </div>
        </div>
        <div class="scorecard-note">
          <strong>Performance Note:</strong> ${escapeHtml(note)}
        </div>
      </div>
    `;
  }

  function sendPayloadSilently(payload) {
    if (!SCRIPT_URL) return;
    try {
      const dataToSend = {
        timestamp: payload.timestamp,
        name: payload.name,
        subject: payload.subject,
        date: payload.date,
        timeTaken: payload.timeTaken,
        total: payload.total,
        attended: payload.attended,
        unattended: payload.unattended,
        score: payload.score,
        percentage: payload.percentage,
        grade: payload.grade
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(dataToSend)
      }).catch(() => {});
    } catch (e) {}
  }

  function escapeHtml(text) {
    if (typeof text !== "string") return text;
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
</script>
</body>
</html>
